<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1920 保安林植物地圖</title>
<meta name="description" content="嘉義縣布袋鎮好美里 1920 保安林（美漾森林）植物紀錄互動地圖">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232f6b3a'/%3E%3Cpath d='M16 6c-5 5-6 11-1 16v4h2v-4c5-5 4-11-1-16z' fill='%23cfe8b5'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f1e8; --panel:#fffdf7; --ink:#1f2a22; --muted:#5d6b60; --line:#ddd6c4;
  --accent:#2f6b3a; --accent-2:#e0b73a;
  --water:#2a5a78; --water-2:#356c8c; --channel:#24485f; --wet:#4f8aa3;
  --forest:#3d7a3f; --forest-d:#2e6233; --forest-l:#5a9449; --bank:#7da659;
  --road:#e3dccb; --trail:#c9a86a; --pond-bank:#8fae6a;
  --shadow:0 6px 24px rgba(20,30,20,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a16; --panel:#1d2520; --ink:#e7eee8; --muted:#a3b1a6; --line:#2f3a33;
    --accent:#8fcf8a; --shadow:0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#141a16; --panel:#1d2520; --ink:#e7eee8; --muted:#a3b1a6; --line:#2f3a33;
  --accent:#8fcf8a; --shadow:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  display:flex; flex-direction:column;
}
header{
  padding:14px 20px 10px; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 14px;
  border-bottom:1px solid var(--line);
}
header h1{margin:0;font-size:1.25rem;letter-spacing:.04em}
header p{margin:0;color:var(--muted);font-size:.88rem}
main{flex:1; display:flex; min-height:0}
#mapWrap{position:relative; flex:1; min-width:0; overflow:hidden; background:#1c3f55; touch-action:none}
#map{width:100%; height:100%; display:block; cursor:grab; user-select:none}
#map.dragging{cursor:grabbing}
aside{
  width:300px; flex:none; border-left:1px solid var(--line); background:var(--panel);
  display:flex; flex-direction:column; min-height:0;
}
aside h2{font-size:.95rem;margin:14px 16px 6px;color:var(--muted);font-weight:600}
#plantList{list-style:none;margin:0;padding:0 8px 12px;overflow:auto}
#plantList li button{
  width:100%; display:flex; align-items:center; gap:10px; padding:6px 8px;
  border:0; background:none; color:inherit; font:inherit; text-align:left; border-radius:10px; cursor:pointer;
}
#plantList li button:hover,#plantList li button.active{background:color-mix(in srgb,var(--accent) 14%,transparent)}
#plantList svg{width:34px;height:34px;flex:none}
#plantList .n{font-weight:600;font-size:.95rem}
#plantList .s{font-size:.75rem;color:var(--muted);font-style:italic}
.legend{padding:10px 16px 14px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;flex:none}

.controls{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.controls button{
  width:38px;height:38px;border-radius:10px;border:0;background:rgba(255,253,247,.94);color:#1f2a22;
  font-size:1.2rem;cursor:pointer;box-shadow:var(--shadow)
}
.controls button.on{background:#2f6b3a;color:#fff}

/* markers */
.marker{cursor:pointer}
.marker .ring{fill:#fffdf7;stroke:#2f6b3a;stroke-width:2.2}
.marker:hover .ring,.marker:focus .ring,.marker.active .ring{stroke:#e0b73a;stroke-width:3.2}
.marker:focus{outline:none}
.marker .lbl{
  font-size:11px;font-weight:700;fill:#fff;paint-order:stroke;stroke:rgba(10,25,15,.85);stroke-width:3px;
  pointer-events:none
}
#map.nolabels .lbl{display:none}
.marker .pulse{fill:none;stroke:#e0b73a;stroke-width:2;opacity:0}
.marker.active .pulse{animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{r:16;opacity:.9}100%{r:30;opacity:0}}

/* info card */
#card{
  position:absolute; left:16px; bottom:16px; width:min(360px,calc(100% - 32px));
  background:var(--panel); color:var(--ink); border-radius:16px; box-shadow:var(--shadow);
  padding:16px 16px 14px; transform:translateY(20px); opacity:0; pointer-events:none; transition:.2s;
  max-height:calc(100% - 32px); overflow:auto;
}
#card.show{transform:none;opacity:1;pointer-events:auto}
#card .top{display:flex;gap:14px;align-items:center}
#card .top svg{width:76px;height:76px;flex:none}
#card h3{margin:0;font-size:1.3rem}
#card .sci{font-style:italic;color:var(--muted);font-size:.85rem;margin-top:2px}
#card .fam{display:inline-block;margin-top:6px;font-size:.75rem;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
#card p{margin:12px 0 0;line-height:1.65;font-size:.92rem}
#card .tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
#card .tags span{font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--muted)}
.marker.alien .ring{stroke:#d9622b;stroke-width:2.8}
.marker .badge{font-size:8px;font-weight:800;fill:#fff;pointer-events:none}
#map.far .lbl{display:none}
.alienTag{font-style:normal;font-size:.7rem;color:#fff;background:#d9622b;border-radius:99px;padding:1px 6px;margin-left:4px;vertical-align:1px}
#card .alien{display:none;margin:6px 0 0 6px;font-size:.75rem;padding:2px 8px;border-radius:99px;background:#d9622b;color:#fff;font-weight:700}
#card .close{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer;width:32px;height:32px}

@media (max-width:760px){
  main{flex-direction:column}
  #mapWrap{flex:none;height:62vh}
  aside{width:auto;border-left:0;border-top:1px solid var(--line);flex:1}
  #plantList{display:grid;grid-template-columns:1fr 1fr;padding:0 8px 12px}
  header{padding:12px 16px 8px}
}
</style>
</head>

const PLANTS = [
  {id:"huangjin", name:"黃槿", sci:"Hibiscus tiliaceus", fam:"錦葵科", icon:"hibiscus", x:230, y:147,

  {id:"hongahilan", name:"紅海欖", sci:"Rhizophora stylosa", fam:"紅樹科", icon:"rhizophora", x:503, y:271,
   desc:"紅樹林植物，最大特徵是從樹幹伸出的拱形「支柱根」，可在泥灘中穩固樹體。具胎生現象：種子在母樹上發芽成細長的胎生苗，成熟後落入泥中生長。台灣野生族群曾消失，現多為復育栽植。",

  {id:"baishuimu", name:"白水木", sci:"Heliotropium foertherianum", fam:"紫草科", icon:"heliotropium", x:453, y:343,
   desc:"葉片密被銀白色絨毛，在枝端呈螺旋狀叢生，遠看一片銀綠。白色小花排成捲曲的蠍尾狀花序。耐鹽耐旱，是典型的海岸植物，原分布於珊瑚礁海岸。",

  {id:"wenshulan", name:"文殊蘭", sci:"Crinum asiaticum", fam:"石蒜科", icon:"crinum", x:524, y:333,

   tags:["紅樹林","呼吸根","原生"]},
  {id:"lanrenshu", name:"欖仁樹", sci:"Terminalia catappa", fam:"使君子科", icon:"terminalia", x:539, y:401,
   desc:"枝條輪生、水平展開，樹形層層如塔。葉片大、倒卵形，冬季落葉前轉為紅黃色。果實扁橢圓、外層有纖維可浮於水上，屬海漂植物。",
   tags:["海漂植物","秋冬紅葉","原生"]},
  {id:"jiee", name:"截萼黃槿", sci:"Thespesia populnea", fam:"錦葵科", icon:"thespesia", x:618, y:400, lp:"b",
   desc:"又名繖楊，外觀與黃槿相似，但葉片較光滑、心形尖端較長，花萼呈截形杯狀而得名。黃花中心為紫紅色，凋謝前也會轉紅。與旁邊的白千層生長在同一塊林地。",
   tags:["海岸樹種","與黃槿相似","與白千層同區"]},
  {id:"mumahuang2", name:"木麻黃（長枝）", sci:"Casuarina sp.", fam:"木麻黃科", icon:"casuarina-long", x:644, y:376,
   desc:"位於截萼黃槿與白千層這一區，小枝特別細長、明顯下垂。木麻黃屬有數種外觀相近的種類（如細枝、粗枝木麻黃），可比較小枝粗細、節間長度與鱗葉數目來辨識。",
   tags:["保安林主力","比較觀察"]},
  {id:"baiqianceng", name:"白千層", sci:"Melaleuca leucadendra", fam:"桃金孃科", icon:"melaleuca", x:660, y:414,
   desc:"樹皮灰白、柔軟，如紙般層層剝落，故名「千層」。花為白色瓶刷狀，葉具香氣（可提煉精油）。耐濕耐鹽，常用於濕地與海岸造林。與截萼黃槿相鄰，生長在同一塊林地。",
   tags:["樹皮千層","耐濕","與截萼黃槿同區"]},
];

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const vp = document.getElementById("viewport");
const el = (t, a = {}) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
let seed = 1920;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = arr => arr[Math.floor(rnd() * arr.length)];

/* ---------- 魚塭格網 ---------- */
function ponds(g, x0, y0, cols, rows, cw, ch, bank) {
  const pal = ["#2c5a75", "#336680", "#264d63", "#3b6f84", "#2f5d6a", "#3a6a5a", "#2d4f3e", "#40738a"];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; ) {
    const span = (i < cols - 1 && rnd() < .25) ? 2 : 1;
    g.appendChild(el("rect", {x:x0 + i * cw + bank / 2, y:y0 + j * ch + bank / 2, width:cw * span - bank, height:ch - bank, rx:1.5, fill:pick(pal)}));
    i += span;
  }
}
ponds(document.getElementById("pondsL"), -640, -520, 16, 26, 80, 58, 5);
ponds(document.getElementById("pondsR"), 200, -360, 9, 26, 92, 52, 5);

/* ---------- 樹冠色塊 ---------- */
const canopy = document.getElementById("canopy");
const tones = ["var(--forest-d)", "var(--forest-l)", "#356f37", "#4a8a43", "#2b5a30"];
for (let i = 0; i < 420; i++) {
  const x = 90 + rnd() * 490, y = rnd() * 611, r = 3 + rnd() * 9;
  canopy.appendChild(el("ellipse", {cx:x.toFixed(1), cy:y.toFixed(1), rx:r.toFixed(1), ry:(r * (.55 + rnd() * .4)).toFixed(1), fill:tones[i % 5], opacity:(.35 + rnd() * .4).toFixed(2)}));
}

/* ---------- 整齊的林間水道（平行等距） ---------- */
const D = [0.45, -0.893], N = [0.893, 0.45];   // 水道方向 / 法向
const SP = 11, CW = 4.2, U0 = 286;             // 間距、水道寬、起點
const rowsG = document.getElementById("rows");
const P = (u, t) => [N[0] * u + D[0] * t, N[1] * u + D[1] * t];
const poly = pts => "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L") + "Z";
for (let u = U0; u < 540; u += SP) {
  rowsG.appendChild(el("path", {d:poly([P(u, -700), P(u + CW, -700), P(u + CW, 700), P(u, 700)]), fill:"var(--channel)"}));
  // 樹列上的樹冠亮帶，強化整齊感
  rowsG.appendChild(el("path", {d:poly([P(u + CW + 2, -700), P(u + CW + 3.4, -700), P(u + CW + 3.4, 700), P(u + CW + 2, 700)]), fill:"#4f8f45", opacity:".55"}));
}
// 判斷某點（全景座標）是否落在水道中
function inChannel(x, y) {
  const u = N[0] * x + N[1] * y - U0, m = ((u % SP) + SP) % SP;
  return m < CW + 0.6 || m > SP - 0.6;
}

/* ---------- 水坑：水紋與樹島 ---------- */
const wetTex = document.getElementById("wetTex");
for (let y = 300; y < 611; y += 7) wetTex.appendChild(el("path", {d:`M100 ${y}q4-2 8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0`, stroke:"#86bad0", "stroke-width":".35", fill:"none", opacity:".6"}));
const isl = document.getElementById("islands");
// 上段：延續樹列方向、斷續的樹列
for (let u = U0 + CW; u < 540; u += SP) {
  for (let t = -420; t < -230; t += 6 + rnd() * 10) {
    if (rnd() < .45) continue;
    const len = 4 + rnd() * 12, a = P(u + 1, t), b = P(u + 1, t + len);
    isl.appendChild(el("path", {d:`M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`, stroke:pick(["#3d7a3f", "#357036", "#4a8a43"]), "stroke-width":(2.6 + rnd() * 1.8).toFixed(1), "stroke-linecap":"round"}));
  }
}
// 下段：散生樹島
for (let i = 0; i < 110; i++) {
  const x = 125 + rnd() * 270, y = 400 + rnd() * 200, r = 1.8 + rnd() * 6;
  isl.appendChild(el("ellipse", {cx:x.toFixed(1), cy:y.toFixed(1), rx:r.toFixed(1), ry:(r * (.6 + rnd() * .4)).toFixed(1), fill:pick(["#3d7a3f", "#357036", "#4a8a43", "#2e6233"]), opacity:(.75 + rnd() * .25).toFixed(2)}));
}
// 底部砂地空地
isl.appendChild(el("ellipse", {cx:172, cy:588, rx:22, ry:12, fill:"#b9a882", opacity:".85"}));

/* ---------- 植物按鈕 ---------- */
const markersG = document.getElementById("markers");
const list = document.getElementById("plantList");
document.getElementById("count").textContent = PLANTS.length;
const markerEls = {};
PLANTS.forEach(p => {
  p.wx = p.x + OX; p.wy = p.y + OY;
  const g = el("g", {class:"marker" + (p.alien ? " alien" : ""), tabindex:"0", role:"button", "aria-label":p.name + (p.alien ? "（外來種）" : ""), "data-id":p.id});
  g.appendChild(el("circle", {class:"pulse", r:16}));
  g.appendChild(el("circle", {r:17, fill:"rgba(0,0,0,.28)", cy:1.5}));
  g.appendChild(el("circle", {class:"ring", r:16}));
  g.appendChild(el("use", {href:"#ic-" + p.icon, x:-12, y:-12, width:24, height:24}));
  if (p.alien) { const b = el("g", {transform:"translate(11 -12)"}); b.appendChild(el("circle", {r:6.5, fill:"#d9622b", stroke:"#fff", "stroke-width":1.5})); const bt = el("text", {class:"badge", y:3.2, "text-anchor":"middle"}); bt.textContent = "外"; b.appendChild(bt); g.appendChild(b); }
  const t = el("text", {class:"lbl", x:p.lp === "l" ? -20 : p.lp === "b" ? 0 : 20, y:p.lp === "b" ? 30 : 4, "text-anchor":p.lp === "l" ? "end" : p.lp === "b" ? "middle" : "start"});
  t.textContent = p.name + (p.alien ? "（外來種）" : "");
  g.appendChild(t);
  g.addEventListener("click", e => { e.stopPropagation(); select(p.id); });
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(p.id); } });
  g.addEventListener("pointerdown", e => e.stopPropagation());
  markersG.appendChild(g);
  markerEls[p.id] = {g, p};

  const li = document.createElement("li");
  li.innerHTML = `<button data-id="${p.id}"><svg viewBox="-20 -20 40 40"><circle r="19" fill="#fffdf7" stroke="${p.alien ? "#d9622b" : "#2f6b3a"}" stroke-width="${p.alien ? 2.5 : 1.5}"/><use href="#ic-${p.icon}" x="-15" y="-15" width="30" height="30"/></svg><span><div class="n">${p.name}${p.alien ? ' <em class="alienTag">外來種</em>' : ""}</div><div class="s">${p.sci}</div></span></button>`;
  li.firstChild.addEventListener("click", () => { select(p.id); focusOn(p); });
  list.appendChild(li);
});

/* ---------- 資訊卡 ---------- */
const card = document.getElementById("card");
let current = null;
function select(id) {
  if (current) { markerEls[current].g.classList.remove("active"); list.querySelector(`[data-id="${current}"]`).classList.remove("active"); }
  current = id;
  const {g, p} = markerEls[id];
  g.classList.add("active"); markersG.appendChild(g);
  list.querySelector(`[data-id="${id}"]`).classList.add("active");
  document.getElementById("cardIcon").setAttribute("href", "#ic-" + p.icon);
  document.getElementById("cardRing").setAttribute("stroke", p.alien ? "#d9622b" : "#2f6b3a");
  document.getElementById("cardName").textContent = p.name;
  document.getElementById("cardSci").textContent = p.sci;
  document.getElementById("cardFam").textContent = p.fam;
  document.getElementById("cardAlien").style.display = p.alien ? "inline-block" : "none";
  document.getElementById("cardDesc").textContent = p.desc;
  document.getElementById("cardTags").innerHTML = p.tags.map(t => `<span>${t}</span>`).join("");
  card.classList.add("show");
}
function closeCard() {
  card.classList.remove("show");
  if (current) { markerEls[current].g.classList.remove("active"); list.querySelector(`[data-id="${current}"]`).classList.remove("active"); current = null; }
}
card.querySelector(".close").addEventListener("click", closeCard);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeCard(); });

/* ---------- 縮放與拖曳（viewBox = 畫面像素） ---------- */
const WW = 628 * 4.4, WH = 611 * 4.4;                 // 全域尺寸
const HOME = {x0:OX + 110, y0:OY + 95, x1:OX + 800, y1:OY + 600}; // 預設：步道區
let cw = 800, ch = 600, k0 = 1, view = {k:1, x:0, y:0}, inited = false;
const minK = () => Math.min(cw / WW, ch / WH) * 0.95;
const fit = r => { const k = Math.min(cw / (r.x1 - r.x0), ch / (r.y1 - r.y0)); return {k, x:cw / 2 - (r.x0 + r.x1) / 2 * k, y:ch / 2 - (r.y0 + r.y1) / 2 * k}; };
function clampView(v = view) {
  v.k = Math.min(k0 * 6, Math.max(minK(), v.k));
  const cx = Math.min(WW, Math.max(0, (cw / 2 - v.x) / v.k)), cy = Math.min(WH, Math.max(0, (ch / 2 - v.y) / v.k));
  v.x = cw / 2 - cx * v.k; v.y = ch / 2 - cy * v.k;
  return v;
}
function apply() {
  clampView();
  vp.setAttribute("transform", `translate(${view.x.toFixed(2)} ${view.y.toFixed(2)}) scale(${view.k.toFixed(4)})`);
  const f = Math.max(.42, Math.min(1, Math.pow(view.k / k0, .6)));
  for (const id in markerEls) { const {g, p} = markerEls[id]; g.setAttribute("transform", `translate(${p.wx} ${p.wy}) scale(${(f / view.k).toFixed(4)})`); }
  svg.classList.toggle("far", view.k < k0 * .65);
}
function resize() {
  const r = svg.getBoundingClientRect(); if (!r.width) return;
  const cx = (cw / 2 - view.x) / view.k, cy = (ch / 2 - view.y) / view.k;
  cw = r.width; ch = r.height; svg.setAttribute("viewBox", `0 0 ${cw} ${ch}`);
  k0 = fit(HOME).k;
  if (!inited) { view = fit(HOME); inited = true; } else { view.x = cw / 2 - cx * view.k; view.y = ch / 2 - cy * view.k; }
  apply();
}
new ResizeObserver(resize).observe(svg);
function toSvg(clientX, clientY) { const r = svg.getBoundingClientRect(); return {x:clientX - r.left, y:clientY - r.top}; }
function zoomAt(px, py, factor) {
  const nk = Math.min(k0 * 6, Math.max(minK(), view.k * factor)), f = nk / view.k;
  view.x = px - (px - view.x) * f; view.y = py - (py - view.y) * f; view.k = nk; apply();
}
function animateTo(target, ms = 450) {
  target = clampView({...target});
  const from = {...view}, t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - t, 3);
    view = {k:from.k + (target.k - from.k) * e, x:from.x + (target.x - from.x) * e, y:from.y + (target.y - from.y) * e};
    apply(); if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function focusOn(p) { const k = Math.max(view.k, k0 * 1.8); animateTo({k, x:cw / 2 - p.wx * k, y:ch / 2 - p.wy * k}); }

svg.addEventListener("wheel", e => { e.preventDefault(); const p = toSvg(e.clientX, e.clientY); zoomAt(p.x, p.y, Math.exp(-e.deltaY * .0015)); }, {passive:false});
const pointers = new Map();
let pinch = null, moved = 0;
svg.addEventListener("pointerdown", e => {
  svg.setPointerCapture(e.pointerId); pointers.set(e.pointerId, toSvg(e.clientX, e.clientY));
  moved = 0; svg.classList.add("dragging");
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = {d:Math.hypot(a.x - b.x, a.y - b.y)}; }
});
svg.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId), cur = toSvg(e.clientX, e.clientY); pointers.set(e.pointerId, cur);
  if (pointers.size === 1) { view.x += cur.x - prev.x; view.y += cur.y - prev.y; moved += Math.abs(cur.x - prev.x) + Math.abs(cur.y - prev.y); apply(); }
  else if (pointers.size === 2 && pinch) { const [a, b] = [...pointers.values()], d = Math.hypot(a.x - b.x, a.y - b.y); zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / pinch.d); pinch.d = d; moved += 10; }
});
const endPtr = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) svg.classList.remove("dragging"); };
svg.addEventListener("pointerup", endPtr);
svg.addEventListener("pointercancel", endPtr);
svg.addEventListener("click", () => { if (moved < 4) closeCard(); });

document.getElementById("zin").onclick = () => zoomAt(cw / 2, ch / 2, 1.5);
document.getElementById("zout").onclick = () => zoomAt(cw / 2, ch / 2, 1 / 1.5);
document.getElementById("zreset").onclick = () => animateTo(fit(HOME));
document.getElementById("zall").onclick = () => animateTo(fit({x0:0, y0:0, x1:WW, y1:WH}));
document.getElementById("lblToggle").onclick = e => { svg.classList.toggle("nolabels"); e.currentTarget.classList.toggle("on"); };
resize();
</script>
</body>
